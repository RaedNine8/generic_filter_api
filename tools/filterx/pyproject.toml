[project]
name = "filterx-cli"
version = "0.1.0"
description = "FilterX smart bootstrap CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "tenacity>=8.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
filterx = "filterx.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
include = ["filterx*"]

[tool.setuptools.package-data]
filterx = ["reference_runtime/**/*"]
